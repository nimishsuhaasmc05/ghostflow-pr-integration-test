[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostflow-scanner"
version = "0.1.0"
description = "Local-first frontend/backend API contract analyzer"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
ghostflow = "ghostflow.cli:main"
ghostflow-pr = "ghostflow.pr_cli:main"

[tool.setuptools.packages.find]
where = ["."]
